version: '3'

tasks:
  # Backend tasks
  install-backend:
    desc: Install backend (Python/Poetry) dependencies
    dir: backend
    cmds:
      - poetry install

  run-backend:
    desc: Run backend in development mode (with Poetry, DB via docker-compose)
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run uvicorn main:app --reload
    preconditions:
      - sh: "docker ps --filter 'name=lukalibre-db' --filter 'status=running' --format '{{.Names}}' | grep lukalibre-db"
        msg: "Database container 'lukalibre-db' is not running, starting with docker-compose up -d."
    sources: [../docker-compose.yml]
    silent: false
    status:
      - '[ $(docker ps --filter "name=lukalibre-db" --filter "status=running" --format "{{.Names}}") ]'
    deps: []
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
    ignore_error: false
    interactive: true
    post:
      - docker-compose stop

  test-backend:
    desc: Run backend tests (with Poetry, DB via docker-compose)
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run pytest
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
    post:
      - docker-compose stop

  # Frontend tasks
  install-frontend:
    desc: Install frontend (Svelte) dependencies
    dir: frontend
    cmds:
      - npm install

  run-frontend:
    desc: Run frontend in development mode
    dir: frontend
    cmds:
      - npm run dev

  build-frontend:
    desc: Build production frontend
    dir: frontend
    cmds:
      - npm run build

  test-frontend:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm run test

  # Full project
  install:
    desc: Install both backend and frontend dependencies
    cmds:
      - task: install-backend
      - task: install-frontend

  dev:
    desc: Run backend and frontend in development mode (parallel)
    cmds:
      - task: run-backend &
      - task: run-frontend

  # Backend testing with examples
  start-api:
    desc: Start backend API with docker-compose for testing
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run uvicorn main:app --reload &
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'

  stop-api:
    desc: Stop backend API and docker-compose
    dir: backend
    cmds:
      - pkill -f "uvicorn main:app"
      - docker-compose stop

  test-api-examples:
    desc: Run API example tests
    dir: examples
    cmds:
      - python3 -m venv venv || true
      - ./venv/bin/pip install -r requirements.txt
      - ./venv/bin/python test_llm_proxy.py
    deps: [start-api]

  test-backend-full:
    desc: Run complete backend testing (unit tests + API examples)
    cmds:
      - task: test-backend
      - task: test-api-examples
    post:
      - task: stop-api

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: test-backend
      - task: test-frontend
