version: '3'

tasks:
  # Backend tasks
  install-backend:
    desc: Install backend (Python/Poetry) dependencies
    dir: backend
    cmds:
      - poetry install

  run-backend:
    desc: Run backend in development mode (with Poetry, DB via docker-compose)
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run uvicorn app.main:app --reload
    preconditions:
      - sh: "docker ps --filter 'name=lukalibre-db' --filter 'status=running' --format '{{.Names}}' | grep lukalibre-db"
        msg: "Database container 'lukalibre-db' is not running, starting with docker-compose up -d."
    sources: [../docker-compose.yml]
    silent: false
    status:
      - '[ $(docker ps --filter "name=lukalibre-db" --filter "status=running" --format "{{.Names}}") ]'
    deps: []
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
    ignore_error: false
    interactive: true
    post:
      - docker-compose stop

  test-backend:
    desc: Run backend tests (with Poetry, DB via docker-compose)
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run pytest
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
    post:
      - docker-compose stop

  # Frontend tasks
  install-frontend:
    desc: Install frontend (Svelte) dependencies
    dir: frontend
    cmds:
      - npm install

  run-frontend:
    desc: Run frontend in development mode
    dir: frontend
    cmds:
      - npm run dev

  build-frontend:
    desc: Build production frontend
    dir: frontend
    cmds:
      - npm run build

  test-frontend:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm run test

  # Full project
  install:
    desc: Install both backend and frontend dependencies
    cmds:
      - task: install-backend
      - task: install-frontend

  dev:
    desc: Run backend and frontend in development mode (parallel)
    deps: [run-backend]
    cmds:
      - task: run-frontend

  # Backend testing with examples
  start-api:
    desc: Start backend API with docker-compose for testing
    dir: backend
    cmds:
      - docker-compose up -d
      - poetry run uvicorn app.main:app --reload &
    env:
      OPENAI_API_KEY:
        sh: grep "^OPENAI_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_API_KEY:
        sh: grep "^OPENROUTER_API_KEY=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      OPENROUTER_BASE_URL:
        sh: grep "^OPENROUTER_BASE_URL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      DEFAULT_LLM_PROVIDER:
        sh: grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_LLM_PROVIDER:
        sh: grep "^FALLBACK_LLM_PROVIDER=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      TEXT_MODEL:
        sh: grep "^TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      IMAGE_MODEL:
        sh: grep "^IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_TEXT_MODEL:
        sh: grep "^FALLBACK_TEXT_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'
      FALLBACK_IMAGE_MODEL:
        sh: grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | cut -d'=' -f2 | tr -d '"'

  stop-api:
    desc: Stop backend API and docker-compose
    dir: backend
    cmds:
      - pkill -f "uvicorn app.main:app"
      - docker-compose stop

  test-api-examples:
    desc: Run API example tests
    dir: examples
    cmds:
      - python3 -m venv venv || true
      - ./venv/bin/pip install -r requirements.txt
      - ./venv/bin/python test_llm_proxy.py
    deps: [start-api]

  test-backend-full:
    desc: Run complete backend testing (unit tests + API examples)
    cmds:
      - task: test-backend
      - task: test-api-examples
    post:
      - task: stop-api

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: test-backend
      - task: test-frontend

  # Environment synchronization
  sync-env:
    desc: Sync .env files from .secrets file
    cmds:
      - task: sync-backend-env
      - task: sync-frontend-env

  sync-backend-env:
    desc: Update backend/.env with values from .secrets
    dir: backend
    cmds:
      - |
        # Update backend .env with LLM configuration from .secrets
        grep "^OPENAI_API_KEY=" ../.secrets | sed 's/^/# LLM Configuration\n/' > temp_llm.env
        grep "^OPENROUTER_API_KEY=" ../.secrets >> temp_llm.env
        grep "^OPENROUTER_BASE_URL=" ../.secrets >> temp_llm.env
        echo "" >> temp_llm.env
        echo "# LLM Provider Configuration" >> temp_llm.env
        grep "^DEFAULT_LLM_PROVIDER=" ../.secrets >> temp_llm.env
        grep "^FALLBACK_LLM_PROVIDER=" ../.secrets >> temp_llm.env
        echo "" >> temp_llm.env
        echo "# Model Configuration - Separate models for cost optimization" >> temp_llm.env
        grep "^TEXT_MODEL=" ../.secrets >> temp_llm.env
        grep "^IMAGE_MODEL=" ../.secrets >> temp_llm.env
        grep "^FALLBACK_TEXT_MODEL=" ../.secrets >> temp_llm.env
        grep "^FALLBACK_IMAGE_MODEL=" ../.secrets >> temp_llm.env
        echo "" >> temp_llm.env
        echo "# Cost Optimization Settings" >> temp_llm.env
        grep "^ENABLE_COST_OPTIMIZATION=" ../.secrets >> temp_llm.env
        grep "^MAX_MONTHLY_LLM_COST=" ../.secrets >> temp_llm.env
        grep "^COST_ALERT_THRESHOLD=" ../.secrets >> temp_llm.env
        echo "" >> temp_llm.env
        echo "# Database Configuration" >> temp_llm.env
        grep "^DB_PASSWORD=" ../.secrets >> temp_llm.env
        # Backup current .env and replace LLM section
        cp .env .env.backup
        sed '/# LLM Configuration/,$d' .env > .env.new
        cat temp_llm.env >> .env.new
        mv .env.new .env
        rm temp_llm.env
        echo "Backend .env updated with secrets"

  sync-frontend-env:
    desc: Update frontend/.env with values from .secrets
    dir: frontend
    cmds:
      - |
        # Update frontend .env with LLM configuration from .secrets
        echo "" >> .env
        echo "# LLM Configuration" >> .env
        grep "^TEXT_MODEL=" ../.secrets | sed 's/^TEXT_MODEL=/VITE_TEXT_MODEL=/' >> .env
        grep "^IMAGE_MODEL=" ../.secrets | sed 's/^IMAGE_MODEL=/VITE_IMAGE_MODEL=/' >> .env
        grep "^FALLBACK_TEXT_MODEL=" ../.secrets | sed 's/^FALLBACK_TEXT_MODEL=/VITE_FALLBACK_TEXT_MODEL=/' >> .env
        grep "^FALLBACK_IMAGE_MODEL=" ../.secrets | sed 's/^FALLBACK_IMAGE_MODEL=/VITE_FALLBACK_IMAGE_MODEL=/' >> .env
        grep "^DEFAULT_LLM_PROVIDER=" ../.secrets | sed 's/^DEFAULT_LLM_PROVIDER=/VITE_DEFAULT_LLM_PROVIDER=/' >> .env
        grep "^OPENROUTER_API_KEY=" ../.secrets | sed 's/^OPENROUTER_API_KEY=/VITE_OPENROUTER_API_KEY=/' >> .env
        grep "^OPENROUTER_BASE_URL=" ../.secrets | sed 's/^OPENROUTER_BASE_URL=/VITE_OPENROUTER_BASE_URL=/' >> .env
        echo "Frontend .env updated with secrets"

  # Complete backend testing
  test-backend-complete:
    desc: Complete backend test with OAuth authentication and LLM integration
    dir: examples
    cmds:
      - python3 -m venv venv || true
      - ./venv/bin/pip install -q requests
      - ./venv/bin/python complete_backend_test.py

  demo-backend:
    desc: Complete backend demo - starts backend and runs comprehensive tests
    cmds:
      - task: start-api
      - task: test-backend-complete
    post:
      - task: stop-api
